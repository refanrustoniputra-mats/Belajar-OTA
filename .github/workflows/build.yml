name: Build ESP32 Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'VERSION'
      - '.github/workflows/build.yml'

# Supaya workflow boleh commit balik ke repoo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Baca versi dari file VERSION
        id: getversion
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Generate version.h
        run: |
          echo "#define FIRMWARE_VERSION \"${{ steps.getversion.outputs.VERSION }}\"" > firmware/ota_dengan_timer/version.h

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --output-dir build \
            firmware/ota_dengan_timer

      - name: Siapkan file hasil build
        run: |
          cp build/ota_dengan_timer.ino.bin firmware.bin
          cp VERSION version.txt

      - name: Commit & push hasil build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware.bin version.txt
          git diff --staged --quiet && echo "Tidak ada perubahan" || git commit -m "Auto-build firmware versi ${{ steps.getversion.outputs.VERSION }}"
          git push
